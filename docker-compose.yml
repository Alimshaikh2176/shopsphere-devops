services:
  db:
    image: postgres:18-alpine
    container_name: shopsphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  backend:
    build:
      context: ./application/backend
    container_name: shopsphere-backend
    restart: unless-stopped
    env_file:
      - ./application/backend/.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - shopsphere-network

  frontend:
    build:
      context: ./application/frontend
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - shopsphere-network

volumes:
  postgres_data:

networks:
  shopsphere-network:
    driver: bridge
